<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil STT Cipasung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .site-header {
            background-color: #003366;
            color: white;
            padding: 20px;
        }

        .site-header h1 {
            margin: 0 0 10px 0;
        }

        .main-nav a {
            color: #e0e0e0;
            margin-right: 15px;
            text-decoration: none;
        }

        .main-nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .contact-form label {
            display: block;
            margin-top: 10px;
        }

        .contact-form input {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
            max-width: 300px;
        }

        .site-footer {
            background-color: #f4f4f4;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <h1>STT Cipasung</h1>
        <nav class="main-nav">
            <a href="#home">Home</a>
            <a href="#programs">Programs</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section>
            <h2>About Us</h2>
            <p>STT Cipasung is a technology college in Tasikmalaya.</p>
            <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="Gedung STT Cipasung">
        </section>

        <section>
            <h2>Contact Us</h2>
            <form action="#" method="post" class="contact-form">
                <p>
                    <label for="rev-name">Name</label>
                    <input type="text" id="rev-name" name="name" placeholder="Name">
                </p>
                <p>
                    <label for="rev-email">Email</label>
                    <input type="email" id="rev-email" name="email" placeholder="Email">
                </p>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 STT Cipasung</p>
    </footer>

</body>

</html>
